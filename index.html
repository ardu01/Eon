*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0b1919;color:#edf4ef;font:13px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:#1d3534;color:#f1f8f3;border:1px solid #48635b;border-radius:9px;padding:9px 12px}button:hover,.on{background:#315b4d}input,select{background:#152827;color:#fff;border:1px solid #4c665c;border-radius:7px;padding:7px;max-width:100%}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none}#top>*{pointer-events:auto}.glass{background:#102321e8;border:1px solid #54726888;box-shadow:0 12px 35px #0008;backdrop-filter:blur(15px);border-radius:14px}#brand{padding:10px 15px;font-size:22px;letter-spacing:5px;font-weight:800;color:#c8e4cb}#stats{padding:11px 14px;flex:1;max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#controls{display:flex;gap:5px;padding:5px}#dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;max-width:95vw;overflow:auto}#dock button{white-space:nowrap}#menu{position:absolute;bottom:77px;left:50%;transform:translateX(-50%);width:min(540px,94vw);padding:14px;display:none;max-height:65vh;overflow:auto}#menu.show{display:block}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tools button{min-height:46px}#inspector{position:absolute;top:77px;right:12px;width:min(340px,calc(100vw - 24px));padding:16px;max-height:calc(100vh - 175px);overflow:auto;display:none}#inspector.show{display:block}#inspector h2{margin:3px 0 8px;font-size:21px}#inspector label{display:block;color:#b2cbbd;margin-top:10px;font-size:12px}#inspector input,#inspector select{width:100%;margin-top:4px}#inspector .kv{display:flex;justify-content:space-between;border-bottom:1px solid #54726844;padding:7px 0;gap:8px}#inspector .kv b{text-align:right}#history{position:absolute;top:77px;left:12px;width:min(360px,calc(100vw - 24px));max-height:60vh;overflow:auto;padding:14px;display:none}#history.show{display:block}#history p{border-bottom:1px solid #ffffff22;padding-bottom:8px;line-height:1.5}#toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);padding:10px 16px;display:none}small{color:#9fb8aa}h3{margin:4px 0 12px}#hint{position:absolute;bottom:85px;left:14px;color:#e3eee8;background:#142924b0;border-radius:9px;padding:8px;pointer-events:none}@media(max-width:650px){#top{top:6px;left:6px;right:6px;flex-wrap:wrap;gap:4px}#brand{font-size:16px;padding:8px}#stats{order:3;flex-basis:100%;max-width:none;padding:8px}#controls{margin-left:auto}#controls button{padding:7px}#inspector{top:106px;max-height:calc(100vh - 198px)}#history{top:106px}#hint{display:none}#dock{bottom:8px}#menu{bottom:69px}}
</style></head><body><canvas id="map"></canvas><div id="top"><div id="brand" class="glass">EON</div><div id="stats" class="glass"></div><div id="controls" class="glass"><button id="play">⏸</button><select id="speed"><option value="1">1×</option><option value="4">4×</option><option value="15">15×</option><option value="50">50×</option></select><button id="save">💾</button></div></div><div id="history" class="glass"><button style="float:right" onclick="toggleHistory()">✕</button><h3>Crónica de la humanidad</h3><div id="events"></div></div><div id="inspector" class="glass"></div><div id="menu" class="glass"></div><div id="toast" class="glass"></div><div id="hint">Toca personas, ciudades o bosques para inspeccionar · Arrastra para explorar · Rueda o pellizca para acercar</div><div id="dock" class="glass"><button data-menu="inspect" class="on">⌕ Inspeccionar</button><button data-menu="create">＋ Crear</button><button data-menu="edit">⚙ Editar</button><button data-menu="world">🌍 Mundo</button><button id="chronicle">📜 Historia</button></div><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),W=140,H=95,tiles=new Uint8Array(W*H),people=[],cities=[],trees=[],history=[];let year=-10000,frame=0,paused=false,mode='inspect',menuOpen='',selected=null,scale=9,ox=0,oy=0,drag=false,moved=false,lastX=0,lastY=0,pointers=new Map(),lastPinch=0;const first=['Ala','Ena','Mara','Lia','Nara','Tara','Iria','Dara','Aren','Eren','Luan','Daro','Taren','Ilan','Soren','Milo','Nilo','Oren'];const cityNames=['Valdara','Aurelia','Neravia','Altamar','Sereia','Lunaria','Arden','Eldora','Caldera','Miravia'];const rand=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.floor(Math.random()*n),idx=(x,y)=>y*W+x,land=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&tiles[idx(x|0,y|0)]!==0;const fmt=n=>Math.round(n).toLocaleString('es-ES');function era(c){if(!c)return 'Prehistoria';let t=c.tech;return t<12?'Paleolítico':t<28?'Neolítico':t<50?'Edad de los Metales':t<78?'Antigüedad':t<110?'Edad Media':t<145?'Renacimiento':t<190?'Era Industrial':t<245?'Era Moderna':t<320?'Era Digital':'Era Futura'}function date(){return year<0?fmt(-year)+' a. C.':fmt(year)+' d. C.'}function log(s){history.unshift({year:date(),s});history.length=Math.min(200,history.length);document.getElementById('events').innerHTML=history.map(e=>'<p><small>'+e.year+'</small><br>'+esc(e.s)+'</p>').join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nearestCity(x,y){let best=null,d=1e6;for(let c of cities){let q=Math.hypot(c.x-x,c.y-y);if(q<d){d=q;best=c}}return d<22?best:null}function createPerson(x,y,c){if(!land(x,y))return null;let p={id:crypto.randomUUID(),name:first[ri(first.length)],x,y,age:ri(26)+15,health:rand(70,100),hunger:rand(65,100),energy:90,job:['Recolector','Cazador','Constructor','Agricultor'][ri(4)],cityId:c?.id||null,children:0};people.push(p);return p}function createCity(x,y,name){if(!land(x,y))return;let c={id:crypto.randomUUID(),name:name||cityNames[ri(cityNames.length)]+(cities.length?'-'+(cities.length+1):''),x,y,food:200,wood:110,stone:70,knowledge:0,tech:0,houses:3,farms:1,health:85,culture:50,government:'Consejo tribal',tax:10};cities.push(c);for(let i=0;i<13;i++)createPerson(x+ri(7)-3,y+ri(7)-3,c);log('Se funda '+c.name+' con sus primeros pobladores.');return c}function gen(){people.length=0;cities.length=0;trees.length=0;history.length=0;year=-10000;frame=0;selected=null;let islands=Array.from({length:18},()=>[rand(0,W),rand(0,H),rand(12,32)]);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=-.25+Math.sin(x*.11)*.09+Math.cos(y*.15)*.1+rand(-.12,.12);for(const [sx,sy,r] of islands)v+=Math.max(0,1-Math.hypot(x-sx,y-sy)/r)*.75;tiles[idx(x,y)]=v<.22?0:v<.32?1:v<.67?2:v<.95?3:4;if(tiles[idx(x,y)]===3&&Math.random()<.2)trees.push({id:crypto.randomUUID(),x,y,age:ri(70)+5,wood:rand(30,90),species:Math.random()<.5?'Roble':'Pino'})}for(let k=0;k<3;k++){for(let j=0;j<500;j++){let x=ri(W),y=ri(H);if(land(x,y)&&!nearestCity(x,y)){createCity(x,y,cityNames[k]);break}}}log('Comienza la historia de la humanidad.');center();}function center(){scale=Math.min(innerWidth/W,innerHeight/H)*1.3;ox=innerWidth/2-W*scale/2;oy=innerHeight/2-H*scale/2}function resize(){let d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#153847';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);const colors=['#22536a','#d8c69b','#83ad73','#387a59','#7e8982'];let x0=Math.max(0,Math.floor(-ox/scale)-1),x1=Math.min(W,Math.ceil((innerWidth-ox)/scale)+1),y0=Math.max(0,Math.floor(-oy/scale)-1),y1=Math.min(H,Math.ceil((innerHeight-oy)/scale)+1);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let t=tiles[idx(x,y)];ctx.fillStyle=colors[t];ctx.fillRect(x,y,1.02,1.02);if(t===2||t===3){let seed=((x*73+y*137)%29)/29;ctx.fillStyle=t===3?'#2b684a':'#9abb7b';ctx.globalAlpha=.22;ctx.beginPath();ctx.ellipse(x+.5,y+.5,.25+seed*.18,.25,0,0,7);ctx.fill();ctx.globalAlpha=1}}for(const t of trees){if(t.x<x0||t.x>x1||t.y<y0||t.y>y1)continue;ctx.fillStyle='#244c31';ctx.beginPath();ctx.arc(t.x+.55,t.y+.65,.63,0,7);ctx.fill();ctx.fillStyle='#4b9660';ctx.beginPath();ctx.arc(t.x+.4,t.y+.3,.53,0,7);ctx.fill()}for(const c of cities){let n=people.filter(p=>p.cityId===c.id).length,r=Math.min(5,2+c.houses*.13);ctx.fillStyle='#152b28aa';ctx.beginPath();ctx.arc(c.x,c.y,r+1,0,7);ctx.fill();ctx.fillStyle='#bfa17b';ctx.fillRect(c.x-1.5,c.y-1.2,3,2.5);ctx.fillStyle='#6b4439';ctx.beginPath();ctx.moveTo(c.x-2,c.y-1);ctx.lineTo(c.x,c.y-2.7);ctx.lineTo(c.x+2,c.y-1);ctx.fill();ctx.fillStyle='#f3e5b2';ctx.font='bold 2px system-ui';ctx.textAlign='center';ctx.fillText(c.name,c.x,c.y-3.7);ctx.font='1.5px system-ui';ctx.fillText(n+' hab. · '+era(c),c.x,c.y+3.5)}for(const p of people){if(p.x<x0||p.x>x1||p.y<y0||p.y>y1)continue;ctx.fillStyle='#2b3530';ctx.fillRect(p.x+.23,p.y+.5,.42,.48);ctx.fillStyle='#f0c7a0';ctx.beginPath();ctx.arc(p.x+.45,p.y+.3,.25,0,7);ctx.fill()}if(selected){let a=selected.obj;ctx.strokeStyle='#ffe7a4';ctx.lineWidth=.17;ctx.beginPath();ctx.arc(a.x+.4,a.y+.3,selected.type==='city'?4:1.4,0,7);ctx.stroke()}ctx.restore();document.getElementById('stats').textContent='🌍 '+date()+' · 👥 '+fmt(people.length)+' habitantes · 🏛 '+cities.length+' ciudades · '+(cities.length?era(cities.reduce((a,b)=>a.tech>b.tech?a:b)):'Sin civilizaciones');requestAnimationFrame(draw)}function update(){frame++;year+=1;if(people.length>1800)people.splice(0,people.length-1800);for(const c of cities){let members=people.filter(p=>p.cityId===c.id),n=members.length;c.food+=c.farms*4+n*.3-n*.65;c.wood+=Math.max(0,n*.06);c.stone+=Math.max(0,n*.025);c.knowledge+=n*.014*(.5+c.health/100);if(c.knowledge>8+Math.pow(c.tech,.85)*1.8){c.knowledge=0;c.tech+=1;if([12,28,50,78,110,145,190,245,320].includes(c.tech))log(c.name+' entra en '+era(c)+'.')}if(c.food>80&&c.wood>35&&c.houses*5<n+6){c.houses++;c.wood-=35;c.food-=15}if(c.food>90&&c.wood>30&&n>c.farms*5){c.farms++;c.wood-=30}c.health=Math.max(20,Math.min(100,c.health+(c.food>0?.08:-1)));if(c.food<0)c.food=0;if(n>28&&c.tech>20&&Math.random()<.002&&cities.length<16){let x=c.x+ri(29)-14,y=c.y+ri(29)-14;if(land(x,y)&&!nearestCity(x,y)){let nc=createCity(x,y);for(let i=0;i<5;i++){let p=members[ri(members.length)];if(p)p.cityId=nc.id}}}}for(let i=people.length-1;i>=0;i--){let p=people[i],c=cities.find(c=>c.id===p.cityId);p.age++;p.hunger-=rand(.5,1.4);if(c&&c.food>0){p.hunger=Math.min(100,p.hunger+1.8);c.food-=.12}if(p.hunger<20)p.health-=rand(1,4);else p.health=Math.min(100,p.health+.15);if(p.age>rand(65,110)||p.health<=0){people.splice(i,1);continue}if(c){p.x=Math.max(0,Math.min(W-1,p.x+rand(-1.2,1.2)));p.y=Math.max(0,Math.min(H-1,p.y+rand(-1.2,1.2)));if(!land(p.x,p.y)){p.x=c.x;p.y=c.y}if(p.age>18&&p.age<45&&c.food>20&&people.length<1800&&Math.random()<.013){let baby=createPerson(c.x+rand(-2,2),c.y+rand(-2,2),c);if(baby){baby.age=0;p.children++;if(Math.random()<.04)log('Nace '+baby.name+' en '+c.name+'.')}}}}if(frame%35===0&&cities.length>1){let c=cities[ri(cities.length)];if(c.tech>30&&Math.random()<.2)log(c.name+' desarrolla nuevos conocimientos y técnicas.') }if(selected&&selected.type==='person'&&!people.includes(selected.obj))selected=null;if(selected&&selected.type==='city'&&frame%10===0)inspect(selected.type,selected.obj,false)}function pointer(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}function pick(x,y){let p=people.find(p=>Math.hypot(p.x-x,p.y-y)<1.2);if(p)return inspect('person',p);let c=cities.find(c=>Math.hypot(c.x-x,c.y-y)<4);if(c)return inspect('city',c);let t=trees.find(t=>Math.hypot(t.x-x,t.y-y)<1.4);if(t)return inspect('tree',t);let ix=Math.floor(x),iy=Math.floor(y);if(ix>=0&&iy>=0&&ix<W&&iy<H)inspect('terrain',{x:ix,y:iy});}function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+esc(b)+'</b></div>'}function inspect(type,obj,show=true){selected={type,obj};let h='<button style="float:right" id="closeInspector">✕</button>';if(type==='city'){let n=people.filter(p=>p.cityId===obj.id).length;h+='<small>ASENTAMIENTO HUMANO</small><h2>'+esc(obj.name)+'</h2><label>Nombre de la ciudad<input id="cityName" value="'+esc(obj.name)+'"></label><label>Gobierno<select id="government">'+['Consejo tribal','Monarquía','República','Democracia','Federación'].map(v=>'<option '+(obj.government===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>Impuestos (%)<input type="range" min="0" max="50" id="tax" value="'+obj.tax+'"></label>';for(const [a,b] of [['Población',n],['Era',era(obj)],['Tecnología',obj.tech],['Conocimiento',fmt(obj.knowledge)],['Alimentos',fmt(obj.food)],['Madera',fmt(obj.wood)],['Piedra',fmt(obj.stone)],['Viviendas',obj.houses],['Granjas',obj.farms],['Salud pública',fmt(obj.health)+'%'],['Cultura',obj.culture+'%']])h+=kv(a,b);h+='<button id="boost">Impulsar investigación</button> <button id="supply">Añadir recursos</button>'}else if(type==='person'){h+='<small>HABITANTE</small><h2>'+esc(obj.name)+'</h2><label>Nombre<input id="personName" value="'+esc(obj.name)+'"></label><label>Profesión<select id="job">'+['Recolector','Cazador','Constructor','Agricultor','Artesano','Investigador','Soldado'].map(v=>'<option '+(obj.job===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>';for(const [a,b] of [['Edad',obj.age+' años'],['Profesión',obj.job],['Salud',fmt(obj.health)+'%'],['Alimentación',fmt(obj.hunger)+'%'],['Hijos',obj.children],['Ciudad',cities.find(c=>c.id===obj.cityId)?.name||'Nómada']])h+=kv(a,b);h+='<button id="heal">Restablecer salud</button>'}else if(type==='tree'){h+='<small>VEGETACIÓN</small><h2>'+obj.species+'</h2>'+kv('Edad',obj.age+' años')+kv('Madera disponible',fmt(obj.wood))+'<button id="harvest">Talar árbol</button>'}else{let types=['Agua','Costa','Pradera','Bosque','Montaña'];h+='<small>TERRENO</small><h2>'+types[tiles[idx(obj.x,obj.y)]]+'</h2>'+kv('Coordenadas',obj.x+', '+obj.y)+kv('Bioma',types[tiles[idx(obj.x,obj.y)]])}let el=document.getElementById('inspector');el.innerHTML=h;if(show)el.classList.add('show');document.getElementById('closeInspector').onclick=()=>{el.classList.remove('show');selected=null};let bind=(id,event,fn)=>{let a=document.getElementById(id);if(a)a.addEventListener(event,fn)};bind('cityName','change',e=>{obj.name=e.target.value.slice(0,35);log('La ciudad pasa a llamarse '+obj.name+'.')});bind('government','change',e=>{obj.government=e.target.value;log(obj.name+' adopta un nuevo gobierno: '+obj.government+'.')});bind('tax','input',e=>obj.tax=+e.target.value);bind('boost','click',()=>{obj.tech+=10;log(obj.name+' experimenta un avance tecnológico.');inspect(type,obj)});bind('supply','click',()=>{obj.food+=500;obj.wood+=300;obj.stone+=200;inspect(type,obj)});bind('personName','change',e=>obj.name=e.target.value.slice(0,35));bind('job','change',e=>{obj.job=e.target.value;inspect(type,obj)});bind('heal','click',()=>{obj.health=100;obj.hunger=100;inspect(type,obj)});bind('harvest','click',()=>{trees.splice(trees.indexOf(obj),1);el.classList.remove('show');selected=null})}function toolAt(x,y){let ix=Math.floor(x),iy=Math.floor(y);if(ix<0||iy<0||ix>=W||iy>=H)return;if(mode==='inspect')return pick(x,y);if(mode==='city')return createCity(ix,iy);if(mode==='human'){for(let i=0;i<6;i++)createPerson(ix+ri(5)-2,iy+ri(5)-2,nearestCity(ix,iy));return}if(mode==='tree'){if(land(ix,iy))trees.push({id:crypto.randomUUID(),x:ix,y:iy,age:1,wood:70,species:'Roble'});return}if(mode==='food'){let c=nearestCity(ix,iy);if(c)c.food+=200;return}if(mode==='tech'){let c=nearestCity(ix,iy);if(c){c.tech+=10;log(c.name+' recibe un impulso tecnológico.')}return}if(mode==='erase'){for(let i=people.length-1;i>=0;i--)if(Math.hypot(people[i].x-x,people[i].y-y)<2)people.splice(i,1);return}if(['water','plain','forest','mountain'].includes(mode)){tiles[idx(ix,iy)]={water:0,plain:2,forest:3,mountain:4}[mode]}}const menus={create:[['city','🏛 Fundar ciudad'],['human','👤 Añadir humanos'],['tree','🌳 Plantar árbol']],edit:[
