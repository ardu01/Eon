<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101c27"><title>EON — Civilization Sandbox</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1520;color:#eaf3f8;font:14px system-ui;overflow:hidden}header{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#142536;border-bottom:1px solid #365065}header strong{font-size:21px;letter-spacing:4px;color:#81e6d9}button,select{background:#21394d;border:1px solid #46667b;color:#e8f7ff;border-radius:9px;padding:9px;cursor:pointer}button.active{background:#087d83;border-color:#6ee7dd}main{display:flex;height:calc(100dvh - 56px)}aside{width:220px;background:#142536;overflow:auto;padding:12px;flex-shrink:0}aside h3{font-size:11px;color:#9bbacb;text-transform:uppercase;letter-spacing:2px}aside button{margin:3px;width:calc(50% - 6px);min-height:45px}section{flex:1;position:relative;min-width:0}canvas{width:100%;height:100%;touch-action:none;display:block}#hud{position:absolute;top:12px;left:12px;background:#112536dd;padding:12px;border-radius:12px;pointer-events:none;line-height:1.7}#tip{position:absolute;bottom:10px;left:10px;background:#112536bb;padding:8px;border-radius:8px;font-size:12px}@media(max-width:650px){main{flex-direction:column-reverse}aside{width:100%;height:145px;display:flex;gap:10px;align-items:flex-start;overflow-x:auto;overflow-y:hidden}aside>div{min-width:230px}aside button{min-height:35px}section{height:calc(100% - 145px)}header{gap:6px;padding:0 6px}header strong{font-size:16px}header button{padding:7px}}</style></head><body><header><strong>EON</strong><span style="opacity:.6">CIVILIZATION SANDBOX</span><span style="flex:1"></span><button id="pause">⏸</button><select id="speed"><option value="1">1×</option><option value="3">3×</option><option value="8">8×</option></select><button id="save">Guardar</button><button id="load">Cargar</button></header><main><aside><div><h3>Crear vida</h3><button data-tool="human">👤 Humanos</button><button data-tool="elf">🧝 Elfos</button><button data-tool="orc">👹 Orcos</button><button data-tool="dwarf">⛏ Enanos</button></div><div><h3>Modificar mundo</h3><button data-tool="land">🌱 Tierra</button><button data-tool="water">🌊 Agua</button><button data-tool="forest">🌲 Bosque</button><button data-tool="mountain">⛰ Montaña</button></div><div><h3>Poderes</h3><button data-tool="meteor">☄ Meteoro</button><button data-tool="fire">🔥 Fuego</button><button data-tool="bless">✨ Bendecir</button><button data-tool="erase">🧹 Borrar</button></div><div><h3>Mundo</h3><button id="new">🌍 Nuevo</button><button id="random">🎲 Poblar</button></div></aside><section><canvas id="world"></canvas><div id="hud"></div><div id="tip">Toca para crear · Arrastra para pintar · Pellizca para zoom</div></section></main><script>
const C=document.querySelector('canvas'),ctx=C.getContext('2d'),W=110,H=75,terrain=new Uint8Array(W*H),units=[];let tool='human',paused=false,tick=0,zoom=1,panX=0,panY=0,drag=false,last=null,pinch=0;const colors=['#2b7194','#7cbb85','#287d57','#7c7b79','#d2bb80'];const races={human:'#f5d6a4',elf:'#9cf0cf',orc:'#f09176',dwarf:'#dfb7ff'};let villages=[];function id(x,y){return y*W+x}function inside(x,y){return x>=0&&y>=0&&x<W&&y<H}function generate(){units.length=0;villages=[];tick=0;let seeds=Array.from({length:15},()=>[Math.random()*W,Math.random()*H,Math.random()*22+7]);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let height=0;for(const [sx,sy,r] of seeds)height+=Math.max(0,1-Math.hypot(x-sx,y-sy)/r);height+=Math.sin(x*.22)*.12+Math.cos(y*.19)*.13+(Math.random()-.5)*.28;terrain[id(x,y)]=height<.37?0:height<.65?4:height<1.3?1:height<1.9?2:3}}function spawn(x,y,r){if(!inside(x,y)||terrain[id(x,y)]===0)return;units.push({x,y,r,hp:100,age:0,food:80});if(units.length>1000)units.shift()}function apply(x,y){if(!inside(x,y))return;const i=id(x,y);if(races[tool]){for(let n=0;n<5;n++)spawn(x+(Math.random()*5|0)-2,y+(Math.random()*5|0)-2,tool)}else if(tool==='meteor'){for(let yy=-4;yy<=4;yy++)for(let xx=-4;xx<=4;xx++)if(inside(x+xx,y+yy)&&Math.hypot(xx,yy)<4)terrain[id(x+xx,y+yy)]=xx*xx+yy*yy<5?0:3;for(let j=units.length-1;j>=0;j--)if(Math.hypot(units[j].x-x,units[j].y-y)<6)units.splice(j,1)}else if(tool==='fire'||tool==='erase'){for(let j=units.length-1;j>=0;j--)if(Math.hypot(units[j].x-x,units[j].y-y)<3)units.splice(j,1);if(tool==='fire')terrain[i]=4}else if(tool==='bless'){for(const u of units)if(Math.hypot(u.x-x,u.y-y)<6){u.hp=100;u.food=100}}else terrain[i]={water:0,land:1,forest:2,mountain:3}[tool]??terrain[i]}function simulate(){tick++;if(tick%3!==0)return;for(let i=units.length-1;i>=0;i--){const u=units[i];u.age++;u.food-=.14;let dx=Math.floor(Math.random()*3)-1,dy=Math.floor(Math.random()*3)-1,nx=u.x+dx,ny=u.y+dy;if(inside(nx,ny)&&terrain[id(nx,ny)]!==0){u.x=nx;u.y=ny}if(terrain[id(u.x,u.y)]===2)u.food=Math.min(100,u.food+2);if(u.food<0)u.hp-=2;if(u.age>1500||u.hp<=0){units.splice(i,1);continue}if(u.food>65&&Math.random()<.0017&&units.length<800){spawn(u.x,u.y,u.r);u.food-=25}for(let j=i-1;j>=0;j--){let v=units[j];if(v.r!==u.r&&Math.abs(v.x-u.x)<2&&Math.abs(v.y-u.y)<2){v.hp-=Math.random()*3;u.hp-=Math.random()*3;break}}}if(tick%180===0){let cells={};for(const u of units){let k=Math.floor(u.x/10)+','+Math.floor(u.y/10)+','+u.r;cells[k]=(cells[k]||0)+1}villages=Object.entries(cells).filter(([k,v])=>v>=5).map(([k,v])=>({x:(+k.split(',')[0])*10+5,y:(+k.split(',')[1])*10+5,r:k.split(',')[2],n:v}))}}function resize(){let r=C.getBoundingClientRect();C.width=r.width*devicePixelRatio;C.height=r.height*devicePixelRatio}window.addEventListener('resize',resize);function render(){let scale=Math.min(C.width/W,C.height/H)*zoom;ctx.fillStyle='#091721';ctx.fillRect(0,0,C.width,C.height);ctx.save();ctx.translate(C.width/2+panX,C.height/2+panY);ctx.scale(scale,scale);ctx.translate(-W/2,-H/2);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let t=terrain[id(x,y)];ctx.fillStyle=colors[t];ctx.fillRect(x,y,1.01,1.01);if(t===2&&((x*31+y*17)%5===0)){ctx.fillStyle='#195f47';ctx.fillRect(x+.3,y+.2,.4,.6)}}for(const v of villages){ctx.fillStyle=races[v.r];ctx.globalAlpha=.2;ctx.beginPath();ctx.arc(v.x,v.y,5,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff0c0';ctx.fillRect(v.x-1,v.y-1,2,2)}for(const u of units){ctx.fillStyle=races[u.r];ctx.beginPath();ctx.arc(u.x+.5,u.y+.5,.43,0,7);ctx.fill()}ctx.restore();document.querySelector('#hud').innerHTML='<b>Año '+Math.floor(tick/90)+'</b><br>Habitantes: '+units.length+'<br>Asentamientos: '+villages.length+'<br>Herramienta: '+tool;requestAnimationFrame(render)}function coord(e){let s=Math.min(C.width/W,C.height/H)*zoom,rect=C.getBoundingClientRect(),px=(e.clientX-rect.left)*devicePixelRatio,py=(e.clientY-rect.top)*devicePixelRatio;return [Math.floor((px-C.width/2-panX)/s+W/2),Math.floor((py-C.height/2-panY)/s+H/2)]}C.addEventListener('pointerdown',e=>{drag=true;last=[e.clientX,e.clientY];C.setPointerCapture(e.pointerId);apply(...coord(e))});C.addEventListener('pointermove',e=>{if(!drag)return;if(e.shiftKey){panX+=(e.clientX-last[0])*devicePixelRatio;panY+=(e.clientY-last[1])*devicePixelRatio}else if(!races[tool])apply(...coord(e));last=[e.clientX,e.clientY]});C.addEventListener('pointerup',()=>drag=false);C.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(7,zoom*(e.deltaY>0?.9:1.1)))},{passive:false});C.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=Math.max(.6,Math.min(7,zoom*d/pinch));pinch=d}},{passive:true});C.addEventListener('touchend',()=>pinch=0);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('[data-tool=human]').classList.add('active');document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'⏸'};document.querySelector('#new').onclick=()=>{if(confirm('¿Generar otro mundo?'))generate()};document.querySelector('#random').onclick=()=>{for(let r of Object.keys(races))for(let i=0;i<18;i++)spawn(Math.random()*W|0,Math.random()*H|0,r)};document.querySelector('#save').onclick=()=>{localStorage.setItem('eon-save',JSON.stringify({terrain:[...terrain],units,villages,tick}));alert('Mundo guardado')};document.querySelector('#load').onclick=()=>{let s=localStorage.getItem('eon-save');if(!s)return alert('No hay partida guardada');let a=JSON.parse(s);terrain.set(a.terrain);units.splice(0,units.length,...a.units);villages=a.villages;tick=a.tick};let lastTime=0;function loop(t){if(t-lastTime>65){lastTime=t;if(!paused)for(let i=0;i<+document.querySelector('#speed').value;i++)simulate()}requestAnimationFrame(loop)}generate();resize();render();requestAnimationFrame(loop);
</script></body></html>
